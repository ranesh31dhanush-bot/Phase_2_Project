version: '3.8'

services:
  # ---------------------------------------------------
  # 1. MongoDB Service (Auth / Users)
  # ---------------------------------------------------
  mongodb:
    image: mongo:7
    container_name: auth_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - auth_network

  # ---------------------------------------------------
  # 2. PostgreSQL Service (Products, Orders, Order Items, Notifications)
  # ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ecommerce_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_network

  # ---------------------------------------------------
  # 3. Redis Service (Queues, Cart, Sessions, Socket.io Pub/Sub Adapter)
  # ---------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: auth_redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # Port 6380 on Windows host, internal 6379 inside Docker
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - auth_network

  # ---------------------------------------------------
  # 4. API Service - Instance 1 (Port 3000)
  # ---------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - APP_URL=http://localhost:3000
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - REDIS_URL=redis://redis:6379
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgrespassword
      - PG_DATABASE=ecommerce_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth_network

  # ---------------------------------------------------
  # 5. API Service - Instance 2 (Port 3001) for Multi-Instance Cross-Talk
  # ---------------------------------------------------
  api_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_api_2
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - APP_URL=http://localhost:3001
      - MONGO_URI=mongodb://mongodb:27017/auth_db
      - REDIS_URL=redis://redis:6379
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=postgres
      - PG_PASSWORD=postgrespassword
      - PG_DATABASE=ecommerce_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth_network

  # ---------------------------------------------------
  # 6. Worker Service (BullMQ Background Email Processor)
  # ---------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_worker
    restart: unless-stopped
    command: ["node", "workers/email.worker.js"]
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://mongodb:27017/auth_db
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - auth_network

# Persistent volumes preserved across container restarts & rebuilds
volumes:
  mongo_data:
  redis_data:
  pgdata:

networks:
  auth_network:
    driver: bridge